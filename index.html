const app=document.getElementById('app');function has(k){return s.bag.includes(k)}function add(k){if(!has(k))s.bag.push(k);document.getElementById('count').textContent=s.bag.length}function steps(n){return '<div class="steps">'+['01 调查','02 庭审','03 反诉','04 判决'].map((x,i)=>`<span class="${i===n?'active':''}">${x}</span>`).join('')+'</div>'}function closeModal(){document.querySelectorAll('video').forEach(v=>v.pause());document.getElementById('modal').innerHTML='';if(s.phase==='evidenceReveal'){s.phase='combine';s.combo=[];s.feedback='异议成立：门店已备货。接下来核对志宇的抵达时间与聊天记录。';render()}}function modal(html){document.getElementById('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><section class="modalbox" role="dialog" aria-modal="true"><button class="topbtn" style="float:right" onclick="closeModal()">关闭 ×</button>${html}</section></div>`}function caseOneRestart(){modal('<h2>重新受理本案？</h2><p>本次调查进度将重置，已解锁结局会保留。</p><button class="primary" onclick="reset()">重新开始</button>')}function reset(){s={phase:'intro',bag:[],line:0,selected:null,trust:5,round:1,feedback:'',combo:[],photo:false};closeModal();render()}function go(p){s.phase=p;s.beat=0;s.feedback='';render();window.scrollTo(0,0);if(p==='counter')counterTransition()}function caseOneBag(){modal('<div class="eyebrow">COURT RECORD</div><h2>证物袋</h2>'+(s.bag.length?s.bag.map(k=>`<button class="evidence" onclick="inspect('${k}')">${evidence[k].name}<small style="display:block;color:var(--muted)">点击重新查看原始记录 →</small></button>`).join(''):'<p>还没有收录证物。先去调查书桌。</p>'))}
function rainScreen(){modal(`<div class="eyebrow">BONUS FILE · 雨天片段</div><h2>同一把伞下</h2><video controls playsinline preload="metadata" poster="${ASSETS.poster}" style="display:block;width:100%;max-height:58vh;background:#211c20;object-fit:contain" onended="rainFinished()"><source src="${ASSETS.rain}" type="video/mp4">当前浏览器无法播放视频。</video><p class="notice">真实物料片段 · 可暂停、重播或全屏查看。此片段不用于证明虚构案件的时间线。</p><div id="rain-note">${s.photo?rainBonus():'<p class="notice">看完这段片刻，再听听恋爱法庭有什么想说的。</p>'}</div>`)}
function rainBonus(){return '<div class="clue">彩蛋已发现 · 同一把伞下</div><p style="font-size:14px">书记员：本庭只负责审理“顺路”，不负责替两位保管雨天回忆。</p><p class="notice">以上为游戏内虚构旁白。</p>'}
function rainFinished(){s.photo=true;const el=document.getElementById('rain-note');if(el)el.innerHTML=rainBonus()}
function recordFrame(kind,title,content){return `<div class="record"><div class="recordbar"><div class="avatar" style="width:34px;height:34px;font-size:16px;background:#f0d7da;color:var(--wine)">${kind}</div><div><strong>${title}</strong><small>CASE 01 · EXHIBIT</small></div></div>${content}<div class="recordfoot">游戏内虚构记录 · 非真实聊天或订单</div></div>`}
function chatMessages(full){return `${full?`<div class="message mine"><div class="bubble">今天可能练得很晚。</div><time>19:30</time></div><div class="message mine"><div class="bubble">外面是不是要下雨了？</div><time>19:30</time></div><div class="message mine"><div class="bubble">不过我可以自己回去。</div><time>19:31</time></div>`:''}<div class="chatname">志宇</div><div class="message"><div class="bubble">还没结束吗？</div><time>20:08</time></div><div class="message mine"><div class="bubble">还要半小时左右，姐姐先休息吧。</div><time>20:12</time></div>`}
function chatScreen(full=false){return recordFrame('J','志宇',`<div class="chatbody" id="chat-scroll"><div class="chatday">案发当晚 · 周五</div>${full?'':'<div class="locked">更早的对话暂未提交，将在补充质询中公开</div>'}${chatMessages(full)}</div>`)}

as('note')?'志宇的便签 · 已收录':'志宇的便签 · 点击展开'}</span></button><div class="desk-pencil" aria-hidden="true"></div><div class="desk-corner" aria-hidden="true">EVERY DETOUR<br>LEADS BACK TO YOU.</div></div><aside class="panel"><h3>调查笔记</h3><p class="notice">点击物品查看，发现重要信息后主动收录。三件关键证物齐全即可开庭。</p>${s.bag.map(k=>`<div class="collected">${evidence[k].name}</div>`).join('')}<p>${['order','bus','chat'].filter(has).length} / 3 件关键证物</p><button class="primary" ${['order','bus','chat'].every(has)?'':'disabled'} onclick="go('court')">正式开庭 →</button></aside></div>`;return}if(s.phase==='court'){const lines=['那天我是出来买草莓牛奶的。','家附近的便利店没货，所以才去了练习室附近那家。','到了以后，想着河岚也快结束了，就等她一起去买。','所以接她只是顺便。'];app.innerHTML=steps(1)+`<div class="split"><section class="court"><div class="eyebrow" style="color:#eac6c8">CROSS-EXAMINATION · 第一轮</div><div class="people"><div class="person">${portrait('haram','河岚')}<div><small>PLAINTIFF</small>河岚</div></div><div class="person">${portrait('jiwoo','志宇')}<div><small>DEFENDANT</small>志宇</div></div></div><div class="testimony"><span class="small">志宇的证词 · ${s.line+1} / 4</span><p>「${lines[s.line]}」</p></div><div class="nav"><button onclick="changeLine(-1)">← 上一句</button><button onclick="press()">追问</button><button onclick="changeLine(1)">下一句 →</button></div>${s.feedback?`<div class="feedback" role="status">${s.feedback}</div>`:''}</section><aside class="panel"><h3>找出矛盾</h3><p class="notice">先切换到有问题的证词，再选择证物提交。</p><p>庭审可信度 ${'●'.repeat(s.trust)}${'○'.repeat(5-s.trust)}</p>${s.bag.map(k=>`<button class="evidence ${s.selected===k?'selected':''}" onclick="selectEvidence('${k}')">${evidence[k].name}</button>`).join('')}<button class="primary" ${s.selected?'':'disabled'} onclick="submit()">提交证据</button>${s.selected?`<button class="secondary" onclick="inspect('${s.selected}')">查看所选证物</button>`:''}<button class="topbtn" onclick="go('investigate')">返回调查</button></aside></div>`;return}if(s.phase==='combine'){app.innerHTML=steps(1)+`<section class="panel"><div class="eyebrow">RECONSTRUCT · 第二轮</div><h2>她在等谁？</h2><div class="dialogue">🍓：「好吧，不是没货，是我自己取消了。」

🎀：「我没有不让看呀。」</div>${chatScreen(true)}<div class="dialogue">🍓：「都是事实，我知道。」

function changeLine(d){s.line=(s.line+d+4)%4;s.feedback='';render()}function selectEvidence(k){s.selected=k;render()}function press(){const hints=['「买牛奶是事实。问题是，为何一定要去那么远的店？」','🍓：「就是没有货了。」\n调查提示：有没有记录能核实“没货”？','🍓：「没错，我等她结束了才一起去买。」\n这与两人共同经历一致，尚无矛盾。','🍓：「顺便接河岚，有什么问题？」\n需要先检查她给出的出门理由。'];s.feedback=hints[s.line];render()}function flash(){let el=document.createElement('div');el.className='flash';el.textContent='OBJECTION! ♡';document.body.appendChild(el);setTimeout(()=>el.remove(),850)}function submit(){if(s.line===1&&s.selected==='order'){s.phase='evidenceReveal';s.feedback='';flash();modal(`<div class="eyebrow">OBJECTION SUSTAINED · 异议成立</div><h2>不是没货，是主动取消。</h2><div class="evidence-reveal"><span>19:35 · 家附近便利店</span><p>草莓牛奶 × 2</p><div class="keyfact">19:37 店员已备货</div><div class="keyfact">19:38 顾客主动取消</div></div><p>🎀：「姐姐，店员都已经备好了。」</p><p>🍓：「……后来不想在那家买了。」</p><p class="notice">“家附近没货”的解释已被推翻，但出门的目的还需要继续查明。</p><button class="primary" onclick="finishReveal()">继续质询 →</button>`);return}s.trust--;if(s.trust<=0){s.trust=5;s.feedback='法庭宣布短暂休庭。可信度已恢复。\n书记员提示：先选中“家附近便利店没货”那句话，再用能说明库存情况的记录反驳。'}else s.feedback=s.selected==='note'?'🍓：「带伞和便利店有没有货，有什么关系？」\n这张便签没有日期，无法反驳当前证词。':s.selected==='order'?'书记员：「这份订单确实重要，但请先指出它与哪一句证词矛盾。」':'🍓：「这份记录能说明这句话哪里不对吗？」\n请核对证词内容与证据能证明的事实。';render()}function toggleCombo(k){if(s.combo.includes(k))s.combo=s.combo.filter(x=>x!==k);else if(s.combo.length<2)s.combo.push(k);else s.combo=[s.combo[1],k];render()}function combine(){if(s.combo.includes('bus')&&s.combo.includes('chat')){go('admit')}else{s.feedback='线索不足：需要一件证明“何时抵达”，另一件证明“知道何时结束”。';render()}}function ending(k){s.end=k;if(!saved.includes(k)){saved.push(k);try{localStorage.setItem('milkz-endings',JSON.stringify(saved))}catch(e){}}go('ending')}

function renderCake(){document.getElementById('count').textContent=cake.bag.length;let phase=cake.phase;let stage=['opening','investigate'].includes(phase)?0:['court1','found','court2'].includes(phase)?1:phase==='ending'?3:2;let head=steps(stage)+'<div class="eyebrow">CASE 02 · THE MISSING STRAWBERRY CAKE</div><h2>消失的草莓蛋糕</h2>';if(cakeScripts[phase]){app.innerHTML=head+cakeStory();return}if(phase==='investigate'){app.innerHTML=head+`<div class="split"><div class="kitchen kitchen-scene" aria-label="厨房调查场景"><div class="kitchen-caption">THE MORNING AFTER <span>09:05 · KITCHEN</span></div><div class="kitchen-tiles" aria-hidden="true"></div><div class="kitchen-counter" aria-hidden="true"></div><button class="kitchen-prop prop-cake" onclick="cakeInspect('box')" aria-label="查看河岚的蛋糕纸盒"><span class="box-lid">STRAWBERRY<br>CAKE</span><span class="box-front"><i class="water-stain"></i></span><span class="prop-label">${cakeHas('box')?'河岚的纸盒 · 已收录':'河岚的蛋糕纸盒'}</span></button><button class="kitchen-prop prop-clean" onclick="cakeInspect('spill')" aria-label="查看厨房纸和饮料瓶"><span class="paper-roll"></span><span class="paper-sheet"><i></i></span><span class="drink-bottle"><i>DRINK</i></span><span class="prop-label">${cakeHas('spill')?'清理痕迹 · 已收录':'厨房纸与饮料瓶'}</span></button><button class="kitchen-prop prop-order" onclick="cakeInspect('order')" aria-label="查看志宇的草莓订单"><span class="order-device"><small>08:50</small><b>新鲜草莓</b><span class="berry-mark">× 1 盒</span><i>配送中</i></span><span class="prop-label">${cakeHas('order')?'志宇的订单 · 已收录':'志宇的手机'}</span></button><button class="kitchen-prop prop-fridge" onclick="cakeInspect('container')" aria-label="查看冰箱上层的保鲜盒"><span class="fridge-door"><span class="fridge-tag">UPPER SHELF</span><span class="fridge-handle"></span><span class="fridge-seam"></span><span class="fridge-memo">先吃早饭</span></span><span class="prop-label">${cakeHas('container')?'保鲜盒 · 已找到蛋糕':'冰箱 · 上层保鲜盒'}</span></button><div class="kitchen-footnote" aria-hidden="true">A LITTLE CARE,<br>A LITTLE SECRET.</div></div><aside class="panel"><h3>调查笔记</h3><p class="notice">先调查原包装、清理痕迹与订单。不要把“移走”直接当成“吃掉”。</p>${cake.bag.map(k=>`<div class="collected">${cakeEvidence[k].name}</div>`).join('')}<p>${['box','spill','order'].filter(cakeHas).length} / 3 件庭前证物</p><button class="primary" ${['box','spill','order'].every(cakeHas)?'':'disabled'} onclick="cakeGo('court1')">正式开庭 →</button></aside></div>`;return}if(phase==='found'){app.innerHTML=head+`<section class="panel"><div class="eyebrow">MISSING ITEM FOUND</div><h2>蛋糕并没有丢。</h2><div class="fridge-box open"><div class="cake-drawing">草莓<br>蛋糕</div><small>连底托一起，完整放在盒子里。</small></div><p>装饰有些歪，原来的草莓也碰坏了，但蛋糕还在。</p><p class="notice">“蛋糕失踪”解决了。“为什么不让打开”，还需要继续问。</p><button class="primary" onclick="cakeConfirmBox()">收录保鲜盒 · 继续庭审 →</button></section>`;return}if(phase==='court1'||phase==='court2'){let one=phase==='court1';let lines=one?['我早上整理过冰箱。','原来的纸盒湿了，所以我处理掉了。','河岚找不到的是原来的盒子，蛋糕没有丢。','至于蛋糕在哪里……先吃早饭再说。']:['蛋糕还在，我一口没吃。','换盒子是因为纸盒湿了。','就是换个盒子，没有准备别的。','你先去吃早饭。'];app.innerHTML=head+`<div class="split"><section class="court"><div class="eyebrow" style="color:#eac6c8">${one?'第一轮 · 追问蛋糕的位置':'第二轮 · 只是换个盒子吗？'}</div><div class="people"><div class="person">${portrait('haram','河岚')}河岚</div><div class="person">${portrait('jiwoo','志宇')}志宇</div></div><div class="testimony"><span class="small">志宇的证词 · ${cake.line+1} / 4</span><p>「${lines[cake.line]}」</p></div><div class="nav"><button onclick="cakeLine(-1)">← 上一句</button><button onclick="cakePress()">追问</button><button onclick="cakeLine(1)">下一句 →</button></div>${cake.feedback?`<div class="feedback" role="status">${cake.feedback}</div>`:''}</section><aside class="panel"><h3>${one?'查明去向':'找出矛盾'}</h3><p class="notice">${one?'这轮证词未必有谎话。先追问：她凭什么确定蛋糕没有丢？':'先指出矛盾的证词，再提交能够反驳的证物。'}</p>${one?'':`<p>庭审可信度 ${'●'.repeat(cake.trust)}${'○'.repeat(5-cake.trust)}</p>`}${cake.bag.map(k=>`<button class="evidence ${cake.selected===k?'selected':''}" onclick="cakeSelect('${k}')">${cakeEvidence[k].name}</button>`).join('')}${one?'':`<button class="primary" ${cake.selected?'':'disabled'} onclick="cakeSubmit()">提交证据</button>`}${cake.selected?`<button class="secondary" onclick="cakeInspect('${cake.selected}')">查看所选证物</button>`:''}<button class="topbtn" onclick="cakeGo('investigate')">返回厨房</button></aside></div>`;return}if(phase==='choices'){app.innerHTML=head+`<section class="panel"><h3>河岚的回答</h3><div class="choices"><button class="secondary" onclick="cakeEnding('A')">「那姐姐下次拿走之前要告诉我。」</button><button class="secondary" onclick="cakeEnding('B')">「那我陪姐姐一起摆草莓。」</button><button class="secondary" onclick="cakeEnding('S')">「我还以为姐姐不让我吃了。」</button></div><p class="notice">选择决定结局。通关后可直接重选。</p></section>`;return}if(phase==='ending'){let e=cakeEndings[cake.end];app.innerHTML=head+`<section class="verdict"><div class="eyebrow">CASE 02 · FINAL VERDICT</div><span class="stamp verdict-stamp">ENDING ${cake.end} · 已宣判</span><h1 style="margin-top:25px">${e.name}</h1><p>${e.rule}</p><p><b>${e.punish}</b></p><hr><div class="dialogue" style="text-align:left">${e.dialog}</div><p class="notice">第二案已收藏 ${cakeSaved.length} / 3</p><div id="export-status" class="notice" role="status"></div><button class="primary" onclick="saveVerdict()">保存判决书图片</button><button class="primary" onclick="cakeGo('choices')">尝试另一种回答</button><button class="secondary" onclick="startCake()">重新调查第二案</button><button class="secondary" onclick="caseMenu()">案件选择</button></section>`}}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(document.getElementById('modal').innerHTML)return;if(scripts[s.phase]&&e.target===document.body){if(e.key==='ArrowRight'){e.preventDefault();storyMove(1)}if(e.key==='ArrowLeft'){e.preventDefault();storyMove(-1)}}});render();
</script></body></html>
