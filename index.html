lex-wrap:wrap}.active{color:var(--wine);font-weight:bold}.panel{background:var(--paper);padding:30px;border:1px solid #d3c0b2}.desk{background:#c8ab92;position:relative;min-height:385px;padding:32px;display:grid;grid-template-columns:repeat(3,1fr);gap:25px;box-shadow:inset 0 0 0 10px #b49278}.object{background:#fff8ec;border:1px solid #a88b7a;box-shadow:5px 7px 0 #876c5655;padding:28px 12px;transform:rotate(-3deg);min-height:125px;transition:transform .2s}.object:nth-child(2n){transform:rotate(4deg)}.object:hover{transform:translateY(-5px)}.object b{font:22px Georgia;display:block}.object small{font-size:12px;display:block;color:var(--muted)}.split{display:grid;grid-template-columns:1.7fr 1fr;gap:26px}.notice{font-size:13px;color:var(--muted)}.collected{border-left:3px solid var(--wine);padding:8px 12px;margin:8px 0;background:#f3e6da;font-size:14px}.court{background:#5b2936;padding:32px;color:var(--paper)}.people{display:flex;justify-content:space-between;gap:20px;margin-bottom:30px}.person{display:flex;gap:12px;align-items:center}.avatar{width:55px;height:55px;border:1px solid #ddbdba;display:grid;place-items:center;background:#784453;font-family:Georgia}.person small{display:block;font-size:10px;letter-spacing:2px;color:#d9bdbd}.testimony{background:var(--paper);color:var(--ink);padding:28px;margin-bottom:20px;min-height:160px}.testimony p{font-size:22px;margin:18px 0 0}.nav{display:flex;justify-content:space-between;align-items:center}.nav button{background:transparent;border:1px solid #d9bdbd;color:var(--paper);padding:6px 20px}.evidence{width:100%;text-align:left;background:transparent;border:1px solid #cfb9aa;padding:12px;margin:5px 0}.selected{border:2px solid var(--wine);background:#f2dfe0}.feedback{padding:15px;background:#ead8c8;margin:20px 0;white-space:pre-line}.dialogue{white-space:pre-line;font-size:17px;line-height:2.2}.choices button{display:block;width:100%;margin:13px 0;text-align:left}.verdict{text-align:center;max-width:720px;margin:30px auto;background:var(--paper);padding:45px;border:1px solid #b99b89;outline:5px double #b99b89;outline-offset:-14px}.verdict h1{font-size:52px;letter-spacing:-1px}.modal{position:fixed;inset:0;background:#302127aa;display:grid;place-items:center;padding:20px;z-index:5}.modalbox{background:var(--paper);padding:28px;max-width:540px;width:100%;max-height:85vh;overflow:auto}.modalbox h2{font-size:23px}.receipt{border:1px dashed #b99b89;padding:20px;font-size:14px;white-space:pre-line}.flash{position:fixed;inset:0;z-index:10;background:#682c3deb;display:grid;place-items:center;color:#fff8ec;font:bold clamp(35px,9vw,95px) Georgia;pointer-events:none;animation:flash .8s forwards}@keyframes flash{0%{opacity:0;transform:scale(1.1)}20%,70%{opacity:1;transform:scale(1)}100%{opacity:0}}@media(max-width:720px){.shell{padding:20px 17px}.hero{grid-template-columns:1fr;gap:35px;padding:40px 0;min-height:0}.file{margin:0 10px 20px;padding:28px}.split{grid-template-columns:1fr}.desk{padding:25px 20px;gap:16px;grid-template-columns:1fr 1fr}.object{padding:20px 8px;min-height:105px}.panel,.court{padding:20px}.subtitle{font-size:20px}.steps{gap:13px}.person{gap:7px}.avatar{width:42px;height:42px}.testimony p{font-size:19px}.verdict{padding:40px 25px}.verdict h1{font-size:40px}footer{display:block}}
</style></head><body><div class="shell"><header><span class="brand">THE COURT OF LOVE</span><div><button class="topbtn" onclick="showBag()">证物袋 <span id="count">0</span></button><button class="topbtn" onclick="restart()">重新开始</button></div></header><main id="app"></main><footer><span>MILKZ · GUILTY OF LOVING YOU</span><span>同人虚构故事 · 聊天、订单及行程均为游戏剧情</span></footer></div><div id="modal"></div><script>
// 照片到位后可在这里填写相对路径；留空则显示姓名头像。
const ASSETS={jiwoo:'',haram:'',umbrella:''};
const evidence={order:{name:'E01 · 便利店订单详情',text:'19:35 下单：草莓牛奶 × 2\n配货门店：家附近便利店\n19:37 已备货，可到店取\n19:38 顾客主动取消订单'},bus:{name:'E02 · 公交行程',text:'19:42 家附近站上车\n20:21 练习室附近站下车\n行程用时：39 分钟'},chat:{name:'E03 · 聊天记录节选',text:'20:08 志宇：还没结束吗？\n20:12 河岚：还要半小时左右，姐姐先休息吧。'},note:{name:'E04 · 无日期便签',text:'「记得带伞。」\n没有日期，也没有写为谁准备。不能据此判断当天出门的目的。'}};
let s={phase:'intro',bag:[],line:0,selected:null,trust:5,round:1,feedback:'',combo:[],photo:false},saved=[];try{saved=JSON.parse(localStorage.getItem('milkz-endings')||'[]');if(!Array.isArray(saved))saved=[]}catch(e){}
const app=document.getElementById('app');function has(k){return s.bag.includes(k)}function add(k){if(!has(k))s.bag.push(k);document.getElementById('count').textContent=s.bag.length}function steps(n){return '<div class="steps">'+['01 调查','02 庭审','03 反诉','04 判决'].map((x,i)=>`<span class="${i===n?'active':''}">${x}</span>`).join('')+'</div>'}function closeModal(){document.getElementById('modal').innerHTML=''}function modal(html){document.getElementById('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><section class="modalbox" role="dialog" aria-modal="true"><button class="topbtn" style="float:right" onclick="closeModal()">关闭 ×</button>${html}</section></div>`}function restart(){modal('<h2>重新受理本案？</h2><p>本次调查进度将重置，已解锁结局会保留。</p><button class="primary" onclick="reset()">重新开始</button>')}function reset(){s={phase:'intro',bag:[],line:0,selected:null,trust:5,round:1,feedback:'',combo:[],photo:false};closeModal();render()}function go(p){s.phase=p;s.feedback='';render();window.scrollTo(0,0)}function showBag(){modal('<div class="eyebrow">COURT RECORD</div><h2>证物袋</h2>'+(s.bag.length?s.bag.map(k=>`<h3>${evidence[k].name}</h3><div class="receipt">${evidence[k].text}</div>`).join('<br>'):'<p>还没有收录证物。先去调查书桌。</p>'))}
function inspect(k){if(k==='order'){modal('<div class="eyebrow">ORDER HISTORY</div><h2>两杯草莓牛奶</h2><div class="receipt">订单状态：已取消\n商品：草莓牛奶 × 2</div><p class="notice">取消订单前，发生过什么？</p><button class="primary" onclick="orderDetail()">展开订单详情</button>');return}if(k==='photo'){modal('<h2>一张撑伞的照片</h2>'+(ASSETS.umbrella?`<img src="${ASSETS.umbrella}" style="width:100%" alt="两人撑伞的照片">`:'<div class="receipt">照片位置预留\n等真实物料到位，再根据画面设计放大线索。</div>')+'<p>目前不作为证据，也不影响结局解锁。</p>');return}modal(`<h2>${evidence[k].name}</h2><div class="receipt">${evidence[k].text}</div><button class="primary" onclick="collect('${k}')">${has(k)?'已收录 · 返回':'收录至证物袋'}</button>`)}function orderDetail(){modal('<h2>订单详情</h2><div class="receipt">'+evidence.order.text+'</div><p>店员已经备好货，取消操作来自顾客本人。</p><button class="primary" onclick="collect(\'order\')">收录至证物袋</button>')}function collect(k){add(k);closeModal();render()}
function portrait(k,name){return ASSETS[k]?`<img class="avatar" src="${ASSETS[k]}" alt="${name}" style="object-fit:cover">`:`<div class="avatar">${name.slice(0,1)}</div>`}
function render(){document.getElementById('count').textContent=s.bag.length;if(s.phase==='intro'){app.innerHTML=`<div class="hero"><section><div class="eyebrow">CASE FILE 001 · THE CONVENIENT DETOUR</div><h1>Guilty of<br><i>Loving You.</i></h1><p class="subtitle">恋爱审判庭</p><p class="quote">「姐姐，你有权保持沉默，<br>但你对我的偏爱将成为呈堂证供。」</p><button class="primary" onclick="go('opening')">受理案件 →</button><p class="notice">已收藏判决 ${saved.length} / 3 · 无需登录 · 手机可玩</p></section><section class="file"><span class="stamp">CASE NO. 0907</span><dl><dt>原告 · 妹妹</dt><dd>柳河岚</dd><dt>被告 · 姐姐</dt><dd>崔志宇</dd><dt>争议事项</dt><dd>姐姐真的只是顺路吗？</dd></dl><p class="notice">涉嫌专程接人，却以买牛奶为由拒不承认。</p></section></div>`;return}if(s.phase==='opening'){app.innerHTML=steps(0)+`<div class="panel"><div class="eyebrow">PROLOGUE · 雨夜</div><h2>顺便接你。</h2><div class="dialogue">练习结束时，河岚在楼下看见了撑伞等候的姐姐。

🎀 河岚：「姐姐怎么来了？」
🍓 志宇：「出来买草莓牛奶，顺便接你。」
🎀 河岚：「还没买？」
🍓 志宇：「嗯，等你一起去。」
🎀 河岚：「姐姐家附近不是也有吗？」
🍓 志宇：「那家今天没货。」

两人后来一起买了牛奶。可第二天，一份被取消的订单，让这句“顺便”变得可疑起来。</div><button class="primary" onclick="go('investigate')">开始庭前调查 →</button></div>`;return}if(s.phase==='investigate'){app.innerHTML=steps(0)+`<div class="eyebrow">INVESTIGATION · 姐姐的书桌</div><h2>有些心事，藏在详情里。</h2><div class="split"><div class="desk"><button class="object" onclick="inspect('order')"><b>ORDER</b>手机订单<small>已取消的购买记录</small></button><button class="object" onclick="inspect('bus')"><b>BUS PASS</b>公交行程<small>一段不算近的路</small></button><button class="object" onclick="inspect('chat')"><b>MESSAGES</b>聊天记录<small>姐姐问了什么？</small></button><button class="object" onclick="inspect('photo')"><b>PHOTOGRAPH</b>雨伞照片<small>真实物料待补充</small></button><button class="object" onclick="inspect('note')"><b>MEMO</b>一张便签<small>没有日期的提醒</small></button></div><aside class="panel"><h3>调查笔记</h3><p class="notice">点击物品查看，发现重要信息后主动收录。三件关键证物齐全即可开庭。</p>${s.bag.map(k=>`<div class="collected">${evidence[k].name}</div>`).join('')}<p>${['order','bus','chat'].filter(has).length} / 3 件关键证物</p><button class="primary" ${['order','bus','chat'].every(has)?'':'disabled'} onclick="go('court')">正式开庭 →</button></aside></div>`;return}if(s.phase==='court'){const lines=['那天我是出来买草莓牛奶的。','家附近的便利店没货，所以才去了练习室附近那家。','到了以后，想着河岚也快结束了，就等她一起去买。','所以接她只是顺便。'];app.innerHTML=steps(1)+`<div class="split"><section class="court"><div class="eyebrow" style="color:#eac6c8">CROSS-EXAMINATION · 第一轮</div><div class="people"><div class="person">${portrait('haram','柳河岚')}<div><small>PLAINTIFF</small>柳河岚</div></div><div class="person">${portrait('jiwoo','崔志宇')}<div><small>DEFENDANT</small>崔志宇</div></div></div><div class="testimony"><span class="small">崔志宇的证词 · ${s.line+1} / 4</span><p>「${lines[s.line]}」</p></div><div class="nav"><button onclick="changeLine(-1)">← 上一句</button><button onclick="press()">追问</button><button onclick="changeLine(1)">下一句 →</button></div></section><aside class="panel"><h3>找出矛盾</h3><p class="notice">先切换到有问题的证词，再选择证物提交。</p><p>庭审可信度 ${'●'.repeat(s.trust)}${'○'.repeat(5-s.trust)}</p>${s.bag.map(k=>`<button class="evidence ${s.selected===k?'selected':''}" onclick="selectEvidence('${k}')">${evidence[k].name}</button>`).join('')}<button class="primary" ${s.selected?'':'disabled'} onclick="submit()">提交证据</button><button class="topbtn" onclick="go('investigate')">返回调查</button></aside></div>${s.feedback?`<div class="feedback" role="status">${s.feedback}</div>`:''}`;return}if(s.phase==='combine'){app.innerHTML=steps(1)+`<section class="panel"><div class="eyebrow">RECONSTRUCT · 第二轮</div><h2>她在等谁？</h2><div class="dialogue">🍓：「好吧，不是没货，是我自己取消了。」
🍓：「但我也可能刚好有事去那附近啊。」
🎀：「那姐姐是什么时候到的？又知不知道我还没结束？」</div><p>选择两件证物，组合出姐姐在等候的线索。</p>${s.bag.map(k=>`<button class="evidence ${s.combo.includes(k)?'selected':''}" onclick="toggleCombo('${k}')">${evidence[k].name}</button>`).join('')}<button class="primary" ${s.combo.length===2?'':'disabled'} onclick="combine()">组合线索</button>${s.feedback?`<div class="feedback" role="status">${s.feedback}</div>`:''}</section>`;return}if(s.phase==='admit'){app.innerHTML=steps(1)+`<section class="panel"><div class="eyebrow">THE TRUTH · 顺便的是牛奶</div><h2>请被告亲口回答。</h2><div class="receipt">20:12 已知河岚大约 20:42 结束。\n20:21 已抵达附近，比预计结束时间早 21 分钟。\n这能支持姐姐提前到场；出门的目的还需要她自己解释。</div><div class="dialogue">🎀：「姐姐到附近以后，做了什么？」
🍓：「……等你。」
🎀：「为什么取消家附近已经备好的牛奶，坐四十分钟车过来？」
🍓：「你不是已经知道了吗？」
🎀：「请被告亲口回答。」
🍓：「因为想接你。」
🎀：「那牛奶呢？」
🍓：「顺便买的。」

书记员：原来如此，顺便的是牛奶。</div><button class="primary" onclick="go('counter')">准备宣判 →</button></section>`;return}if(s.phase==='counter'){app.innerHTML=steps(2)+`<section class="panel"><div class="eyebrow">COUNTERCLAIM · 姐姐申请补充质询</div><h2>现在轮到姐姐问了。</h2><div class="dialogue">🍓：「既然要看聊天记录，就不要只看姐姐发的部分。」
🎀：「我没有不让看呀。」</div><div class="receipt">19:30 河岚：今天可能练得很晚。\n19:30 河岚：外面是不是要下雨了？\n19:31 河岚：不过我可以自己回去。</div><div class="dialogue">🍓：「都是事实，姐姐知道。」
🍓：「姐姐只想问，你当时希望我怎么回复？」</div><div class="choices"><button class="secondary" onclick="ending('A')">「现在审的是姐姐，请不要转移话题。」</button><button class="secondary" onclick="ending('B')">「……如果姐姐愿意来，我当然会开心。」</button><button class="secondary" onclick="ending('S')">「我就是想让姐姐来接我。」</button></div><p class="notice">此处没有推理对错。你的回答决定本案判决。</p></section>`;return}if(s.phase==='ending'){let type=s.end;let endings={A:{title:'姐姐认罪',rule:'被告专程接人、谎称顺路，事实成立。',punish:'以后接妹妹时，不许再说顺路。',dialog:'🎀：「听清判决了吗？」\n🍓：「听清了。下次还来接你。」\n🎀：「重点是不要说顺路！」'},B:{title:'双方都有一点嘴硬',rule:'姐姐专程接人，妹妹暗藏期待。',punish:'以后想见对方，就直接说。',dialog:'🍓：「所以你也在等我问？」\n🎀：「……一点点。」\n🍓：「那姐姐下次早点问。」'},S:{title:'The Way Home',rule:'原告与被告，当庭承认想见彼此。',punish:'两人今后的回家路线，永久合并。',dialog:'🍓：「我知道。」\n🎀：「那姐姐为什么还说顺路？」\n🍓：「怕你觉得我太黏人。」\n🎀：「可是我就喜欢姐姐黏着我呀。」\n\n🍓：「那下次还要接吗？」\n🎀：「要。已经改正了，姐姐也要改。」\n🍓：「好。下次我说，我来接你。」'}};let e=endings[type];app.innerHTML=steps(3)+`<section class="verdict"><div class="eyebrow">THE COURT OF LOVE · FINAL VERDICT</div><span class="stamp">ENDING ${type}</span><h1 style="margin-top:25px">${e.title}</h1><p>${e.rule}</p><p><b>${e.punish}</b></p><hr style="border:0;border-top:1px solid #d3c0b2;margin:28px 0"><div class="dialogue" style="text-align:left">${e.dialog}</div><p class="notice" style="margin-top:25px">判决已收藏 · ${saved.length} / 3</p><button class="primary" onclick="go('counter')">尝试另一种回答</button><button class="secondary" onclick="reset()">重新调查</button></section>`}}
function changeLine(d){s.line=(s.line+d+4)%4;s.feedback='';render()}function selectEvidence(k){s.selected=k;render()}function press(){const hints=['「买牛奶是事实。问题是，为何一定要去那么远的店？」','🍓：「就是没有货了。」\n调查提示：有没有记录能核实“没货”？','🍓：「没错，我等她结束了才一起去买。」\n这与两人共同经历一致，尚无矛盾。','🍓：「顺便照顾妹妹，有什么问题？」\n需要先检查她给出的出门理由。'];s.feedback=hints[s.line];render()}function flash(){let el=document.createElement('div');el.className='flash';el.textContent='OBJECTION! ♡';document.body.appendChild(el);setTimeout(()=>el.remove(),850)}function submit(){if(s.line===1&&s.selected==='order'){flash();s.phase='combine';s.combo=[];s.feedback='异议成立：门店已经备货，“家附近没货”的解释不成立。';render();return}s.trust--;if(s.trust<=0){s.trust=5;s.feedback='法庭宣布短暂休庭。可信度已恢复。\n书记员提示：先选中“家附近便利店没货”那句话，再用能说明库存情况的记录反驳。'}else s.feedback=s.selected==='note'?'🍓：「带伞和便利店有没有货，有什么关系？」\n这张便签没有日期，无法反驳当前证词。':s.selected==='order'?'书记员：「这份订单确实重要，但请先指出它与哪一句证词矛盾。」':'🍓：「这份记录能说明这句话哪里不对吗？」\n请核对证词内容与证据能证明的事实。';render()}function toggleCombo(k){if(s.combo.includes(k))s.combo=s.combo.filter(x=>x!==k);else if(s.combo.length<2)s.combo.push(k);else s.combo=[s.combo[1],k];render()}function combine(){if(s.combo.includes('bus')&&s.combo.includes('chat')){go('admit')}else{s.feedback='线索不足：需要一件证明“何时抵达”，另一件证明“知道何时结束”。';render()}}function ending(k){s.end=k;if(!saved.includes(k)){saved.push(k);try{localStorage.setItem('milkz-endings',JSON.stringify(saved))}catch(e){}}go('ending')}
