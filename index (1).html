const app=document.getElementById('app');function has(k){return s.bag.includes(k)}function add(k){if(!has(k))s.bag.push(k);document.getElementById('count').textContent=s.bag.length}function steps(n){return '<div class="steps">'+['01 调查','02 庭审','03 反诉','04 判决'].map((x,i)=>`<span class="${i===n?'active':''}">${x}</span>`).join('')+'</div>'}function closeModal(){document.getElementById('modal').innerHTML=''}function modal(html){document.getElementById('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><section class="modalbox" role="dialog" aria-modal="true"><button class="topbtn" style="float:right" onclick="closeModal()">关闭 ×</button>${html}</section></div>`}function restart(){modal('<h2>重新受理本案？</h2><p>本次调查进度将重置，已解锁结局会保留。</p><button class="primary" onclick="reset()">重新开始</button>')}function reset(){s={phase:'intro',bag:[],line:0,selected:null,trust:5,round:1,feedback:'',combo:[],photo:false};closeModal();render()}function go(p){s.phase=p;s.beat=0;s.feedback='';render();window.scrollTo(0,0)}function showBag(){modal('<div class="eyebrow">COURT RECORD</div><h2>证物袋</h2>'+(s.bag.length?s.bag.map(k=>`<button class="evidence" onclick="inspect('${k}')">${evidence[k].name}<small style="display:block;color:var(--muted)">点击重新查看原始记录 →</small></button>`).join(''):'<p>还没有收录证物。先去调查书桌。</p>'))}
function recordFrame(kind,title,content){return `<div class="record"><div class="recordbar"><div class="avatar" style="width:34px;height:34px;font-size:16px;background:#f0d7da;color:var(--wine)">${kind}</div><div><strong>${title}</strong><small>CASE 01 · EXHIBIT</small></div></div>${content}<div class="recordfoot">游戏内虚构记录 · 非真实聊天或订单</div></div>`}
function chatMessages(full){return `${full?`<div class="message mine"><div class="bubble">今天可能练得很晚。</div><time>19:30</time></div><div class="message mine"><div class="bubble">外面是不是要下雨了？</div><time>19:30</time></div><div class="message mine"><div class="bubble">不过我可以自己回去。</div><time>19:31</time></div>`:''}<div class="chatname">志宇姐姐</div><div class="message"><div class="bubble">还没结束吗？</div><time>20:08</time></div><div class="message mine"><div class="bubble">还要半小时左右，姐姐先休息吧。</div><time>20:12</time></div>`}
function chatScreen(full=false){return recordFrame('J','志宇姐姐',`<div class="chatbody" id="chat-scroll"><div class="chatday">案发当晚 · 周五</div>${full?'':'<div class="locked">更早的对话暂未提交，将在补充质询中公开</div>'}${chatMessages(full)}</div>`)}
function inspect(k){if(k==='order'){orderScreen(false);return}if(k==='bus'){busScreen(false);return}if(k==='chat'){modal('<div class="screenlabel">E03 · 聊天记录节选</div>'+chatScreen()+'<p class="notice">留意消息时间，以及河岚预计什么时候结束练习。</p><button class="primary" onclick="collect(&quot;chat&quot;)">'+(has('chat')?'已收录 · 返回':'收录至证物袋')+'</button>');return}if(k==='photo'){modal('<h2>一张撑伞的照片</h2>'+(ASSETS.umbrella?`<img src="${ASSETS.umbrella}" style="width:100%" alt="两人撑伞的照片">`:'<div class="receipt">照片位置预留\n等真实物料到位，再根据画面设计放大线索。</div>')+'<p>目前不作为证据，也不影响结局解锁。</p>');return}modal(`<h2>${evidence[k].name}</h2><div class="receipt">${evidence[k].text}</div><button class="primary" onclick="collect('${k}')">${has(k)?'已收录 · 返回':'收录至证物袋'}</button>`)}
function orderScreen(detail){modal('<div class="screenlabel">E01 · 便利店订单</div>'+recordFrame('M','我的订单',`<div class="recbody"><span class="statuspill">订单已取消</span><div class="product"><div class="milk">STRAWBERRY<br>MILK</div><div><b>草莓牛奶</b><div class="notice">数量 × 2 · 到店自取</div></div></div><div class="kv"><span>下单时间</span>案发当晚 19:35</div>${detail?`<div class="kv"><span>配货门店</span>家附近便利店</div><div class="timeline"><div class="event"><time>19:35</time>订单提交成功</div><div class="event"><time>19:37</time>店员已备货，可随时到店取</div><div class="event"><time>19:38</time>顾客主动取消订单</div></div>`:'<button class="recbutton" onclick="orderScreen(true)">查看订单进度 ＋</button>'}</div>`)+(detail?'<div class="clue">店员已经备好货；取消操作来自顾客本人。</div><button class="primary" onclick="collect(&quot;order&quot;)">'+(has('order')?'已收录 · 返回':'收录至证物袋')+'</button>':'<p class="notice">只看到取消状态，还不足以判断此前是否有货。</p>'))}
function busScreen(detail){modal('<div class="screenlabel">E02 · 公交乘车记录</div>'+recordFrame('B','出行记录',`<div class="recbody"><div class="kv"><span>出行日期</span>案发当晚 · 周五</div><h3 style="margin:20px 0 4px">一段 39 分钟的行程</h3><p class="notice">公交 · 已完成</p>${detail?`<div class="route"><div class="stop">家附近站<small>19:42 上车</small></div><div class="stop">练习室附近站<small>20:21 下车</small></div></div><div class="kv"><span>行程用时</span>39 分钟</div>`:'<button class="recbutton" onclick="busScreen(true)">展开乘车详情 ＋</button>'}</div>`)+(detail?'<p class="notice">抵达时，距离妹妹预计结束练习还有多久？</p><button class="primary" onclick="collect(&quot;bus&quot;)">'+(has('bus')?'已收录 · 返回':'收录至证物袋')+'</button>':'<p class="notice">点开详情，核对上下车站点和时间。</p>'))}
function orderDetail(){orderScreen(true)}function collect(k){add(k);closeModal();render()}
function portrait(k,name){return ASSETS[k]?`<img class="avatar" src="${ASSETS[k]}" alt="${name}" style="object-fit:cover">`:`<div class="avatar">${name.slice(0,1)}</div>`}
function baseRender(){document.getElementById('count').textContent=s.bag.length;if(s.phase==='intro'){app.innerHTML=`<div class="hero"><section><div class="eyebrow">CASE FILE 001 · THE CONVENIENT DETOUR</div><h1>Guilty of<br><i>Loving You.</i></h1><p class="subtitle">恋爱审判庭</p><p class="quote">「姐姐，你有权保持沉默，<br>但你对我的偏爱将成为呈堂证供。」</p><button class="primary" onclick="go('opening')">受理案件 →</button><p class="notice">已收藏判决 ${saved.length} / 3 · 无需登录 · 手机可玩</p></section><section class="file"><span class="stamp">CASE NO. 0907</span><dl><dt>原告 · 妹妹</dt><dd>柳河岚</dd><dt>被告 · 姐姐</dt><dd>崔志宇</dd><dt>争议事项</dt><dd>姐姐真的只是顺路吗？</dd></dl><p class="notice">涉嫌专程接人，却以买牛奶为由拒不承认。</p></section></div>`;return}if(s.phase==='opening'){app.innerHTML=steps(0)+`<div class="panel"><div class="eyebrow">PROLOGUE · 雨夜</div><h2>顺便接你。</h2><div class="dialogue">练习结束时，河岚在楼下看见了撑伞等候的姐姐。

🎀 河岚：「姐姐怎么来了？」
🍓 志宇：「出来买草莓牛奶，顺便接你。」
🎀 河岚：「还没买？」
🍓 志宇：「嗯，等你一起去。」

)}</p>${s.bag.map(k=>`<button class="evidence ${s.selected===k?'selected':''}" onclick="selectEvidence('${k}')">${evidence[k].name}</button>`).join('')}<button class="primary" ${s.selected?'':'disabled'} onclick="submit()">提交证据</button>${s.selected?`<button class="secondary" onclick="inspect('${s.selected}')">查看所选证物</button>`:''}<button class="topbtn" onclick="go('investigate')">返回调查</button></aside></div>${s.feedback?`<div class="feedback" role="status">${s.feedback}</div>`:''}`;return}if(s.phase==='combine'){app.innerHTML=steps(1)+`<section class="panel"><div class="eyebrow">RECONSTRUCT · 第二轮</div><h2>她在等谁？</h2><div class="dialogue">🍓：「好吧，不是没货，是我自己取消了。」

function changeLine(d){s.line=(s.line+d+4)%4;s.feedback='';render()}function selectEvidence(k){s.selected=k;render()}function press(){const hints=['「买牛奶是事实。问题是，为何一定要去那么远的店？」','🍓：「就是没有货了。」\n调查提示：有没有记录能核实“没货”？','🍓：「没错，我等她结束了才一起去买。」\n这与两人共同经历一致，尚无矛盾。','🍓：「顺便照顾妹妹，有什么问题？」\n需要先检查她给出的出门理由。'];s.feedback=hints[s.line];render()}function flash(){let el=document.createElement('div');el.className='flash';el.textContent='OBJECTION! ♡';document.body.appendChild(el);setTimeout(()=>el.remove(),850)}function submit(){if(s.line===1&&s.selected==='order'){flash();s.phase='combine';s.combo=[];s.feedback='异议成立：门店已经备货，“家附近没货”的解释不成立。';render();return}s.trust--;if(s.trust<=0){s.trust=5;s.feedback='法庭宣布短暂休庭。可信度已恢复。\n书记员提示：先选中“家附近便利店没货”那句话，再用能说明库存情况的记录反驳。'}else s.feedback=s.selected==='note'?'🍓：「带伞和便利店有没有货，有什么关系？」\n这张便签没有日期，无法反驳当前证词。':s.selected==='order'?'书记员：「这份订单确实重要，但请先指出它与哪一句证词矛盾。」':'🍓：「这份记录能说明这句话哪里不对吗？」\n请核对证词内容与证据能证明的事实。';render()}function toggleCombo(k){if(s.combo.includes(k))s.combo=s.combo.filter(x=>x!==k);else if(s.combo.length<2)s.combo.push(k);else s.combo=[s.combo[1],k];render()}function combine(){if(s.combo.includes('bus')&&s.combo.includes('chat')){go('admit')}else{s.feedback='线索不足：需要一件证明“何时抵达”，另一件证明“知道何时结束”。';render()}}function ending(k){s.end=k;if(!saved.includes(k)){saved.push(k);try{localStorage.setItem('milkz-endings',JSON.stringify(saved))}catch(e){}}go('ending')}

function render(){if(!scripts[s.phase]){baseRender();return}document.getElementById('count').textContent=s.bag.length;let list=scripts[s.phase];let at=Math.min(s.beat||0,list.length-1);s.beat=at;let [who,name,line]=list[at];let final=at===list.length-1;let phase=s.phase;app.innerHTML=steps(phase==='opening'?0:phase==='admit'?1:2)+`<div class="eyebrow">${phase==='opening'?'PROLOGUE · 雨夜':phase==='admit'?'THE TRUTH · 顺便的是牛奶':'COUNTERCLAIM · 姐姐的反诉'}</div><div class="stage"><div class="stagepeople">${[['haram','柳河岚','原告 · 妹妹'],['jiwoo','崔志宇','被告 · 姐姐']].map(([id,n,role])=>`<div class="actor ${who===id?'speaking':''}">${portrait(id,n)}<b>${n}</b><small>${role}</small></div>`).join('')}</div><div class="bench"></div></div><section class="speechbox"><div class="speaker">${name}</div>${who==='record'?chatScreen(true):`<div class="speechtext">${line}</div>`}<div class="speechcontrols"><span class="storyhint">${at+1} / ${list.length} · 点击下一句推进</span><div><button class="topbtn" onclick="showHistory()">对话回顾</button><button class="secondary" ${at===0?'disabled':''} onclick="storyMove(-1)">上一句</button>${phase==='counter'&&final?'':`<button class="primary" onclick="storyMove(1)">${final?(phase==='opening'?'开始调查 →':'准备宣判 →'):'下一句 →'}</button>`}</div></div></section>${phase==='counter'&&final?`<section class="panel counterchoices" style="margin-top:20px"><h3>河岚的回答</h3><div class="choices"><button class="secondary" onclick="ending('A')">「现在审的是姐姐，请不要转移话题。」</button><button class="secondary" onclick="ending('B')">「……如果姐姐愿意来，我当然会开心。」</button><button class="secondary" onclick="ending('S')">「我就是想让姐姐来接我。」</button></div><p class="notice">这里没有推理对错。你的回答决定本案判决。</p></section>`:''}`}
function storyMove(d){const list=scripts[s.phase];if(!list)return;const at=s.beat||0;if(d>0&&at===list.length-1){if(s.phase==='opening')go('investigate');else if(s.phase==='admit')go('counter');return}s.beat=Math.max(0,Math.min(list.length-1,at+d));render()}
function showHistory(){let lines=scripts[s.phase];if(!lines)return;modal('<div class="eyebrow">DIALOGUE LOG</div><h2>对话回顾</h2>'+lines.slice(0,(s.beat||0)+1).map(([who,n,line])=>`<div class="historyrow"><b>${n}</b>${who==='record'?'已公开案发当晚完整聊天记录。':line}</div>`).join(''))}
function showCollection(){modal('<div class="eyebrow">VERDICT ARCHIVE · CASE 01</div><h2>判决收藏</h2><p class="notice">已解锁 '+saved.length+' / 3 · 收藏保存在当前浏览器。</p>'+Object.entries(endingCards).map(([k,[name,rule,punish]])=>saved.includes(k)?`<article class="collectioncard"><span class="small">ENDING ${k} · 已解锁</span><h3>${name}</h3><p>${rule}</p><p><b>${punish}</b></p></article>`:`<article class="collectioncard lockedcard"><span class="small">ENDING ${k} · 尚未解锁</span><h3>未公开判决</h3><p class="notice">在姐姐反诉时，试着作出不同的回答。</p></article>`).join(''))}
